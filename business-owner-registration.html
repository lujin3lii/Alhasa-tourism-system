<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Owner Registration | Al-Ahsa Vision Hub</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .business-registration-page {
            min-height: 100vh;
            padding: 42px 18px 60px;
            color: #263b32;
            background: linear-gradient(135deg, #ffffff, #f5f8f4, #eaf2eb);
            font-family: inherit;
        }

        .business-registration-page * {
            box-sizing: border-box;
        }

        .registration-wrap {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
        }

        .brand-heading {
            text-align: center;
            margin-bottom: 26px;
        }

        .project-logo {
            display: block;
            width: 125px;
            height: 125px;
            object-fit: contain;
            margin: 0 auto 14px;
        }

        .brand-heading h1 {
            margin: 0 0 8px;
            color: #075b45;
            font-size: 30px;
        }

        .brand-heading p {
            margin: 0;
            color: #68796e;
            font-size: 15px;
            line-height: 1.7;
        }

        .back-home-container {
            margin-bottom: 16px;
            text-align: left;
        }

        .back-home-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #075b45;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-home-link:hover {
            color: #08775a;
            text-decoration: underline;
        }

        .registration-card {
            padding: 32px;
            background: #ffffff;
            border: 1px solid #dfe8e1;
            border-radius: 20px;
            box-shadow: 0 16px 42px rgba(32, 72, 51, 0.09);
        }

        .form-intro {
            margin-bottom: 25px;
        }

        .form-intro h2 {
            margin: 0 0 7px;
            color: #263b32;
            font-size: 22px;
        }

        .form-intro p {
            margin: 0;
            color: #68796e;
            font-size: 14px;
            line-height: 1.7;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 19px 18px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }

        .field.full-width {
            grid-column: 1 / -1;
        }

        .field label {
            color: #263b32;
            font-size: 14px;
            font-weight: 600;
        }

        .required {
            color: #b54747;
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            min-height: 47px;
            padding: 12px 14px;
            border: 1px solid #d7e1d9;
            border-radius: 10px;
            background: #ffffff;
            color: #263b32;
            font: inherit;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .field textarea {
            min-height: 100px;
            resize: vertical;
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: #08775a;
            box-shadow: 0 0 0 3px rgba(8, 119, 90, 0.12);
        }

        .field input::placeholder,
        .field textarea::placeholder {
            color: #9aa79d;
        }

        .hint {
            color: #7b8a7f;
            font-size: 12px;
            line-height: 1.5;
        }

        .form-actions {
            margin-top: 26px;
        }

        .submit-button {
            width: 100%;
            min-height: 49px;
            padding: 13px 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #075b45, #08775a);
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .submit-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(7, 91, 69, 0.2);
        }

        .login-note {
            margin-top: 18px;
            text-align: center;
            color: #68796e;
            font-size: 13px;
        }

        .login-note a {
            color: #075b45;
            font-weight: bold;
            text-decoration: none;
        }

        .login-note a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .business-registration-page {
                padding: 28px 14px 42px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .field.full-width {
                grid-column: auto;
            }

            .registration-card {
                padding: 22px 18px;
            }

            .project-logo {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>

<body>

<main class="business-registration-page">

    <!-- Back to Home -->
    <div class="back-home-container">
        <a href="index.html" class="back-home-link">
            &larr; Back to Home
        </a>
    </div>

    <div class="registration-wrap">

        <!-- Project Logo and Name -->
        <header class="brand-heading">

            <img
                src="images/logo.png"
                alt="Al-Ahsa Vision Hub Logo"
                class="project-logo"
            >

            <h1>Al-Ahsa Vision Hub</h1>

            <p>
                Join our community and share your business
                with visitors of Al-Ahsa.
            </p>

        </header>

        <!-- Registration Form -->
        <section class="registration-card">

            <div class="form-intro">
                <h2>Business Owner Registration</h2>
                <p>
                    Enter your details and business information
                    to create an account.
                </p>
            </div>

            <form id="businessRegistrationForm">

                <div class="form-grid">

                    <div class="field">
                        <label for="ownerName">
                            Owner Full Name <span class="required">*</span>
                        </label>
                        <input
                            type="text"
                            id="ownerName"
                            name="owner_name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="businessName">
                            Business Name <span class="required">*</span>
                        </label>
                        <input
                            type="text"
                            id="businessName"
                            name="business_name"
                            placeholder="Enter your business name"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="email">
                            Email Address <span class="required">*</span>
                        </label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="name@example.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="phone">
                            Phone Number <span class="required">*</span>
                        </label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            autocomplete="tel"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="businessType">
                            Business Type <span class="required">*</span>
                        </label>
                        <select
                            id="businessType"
                            name="business_type"
                            required
                        >
                            <option value="" selected disabled>
                                Select business type
                            </option>
                            <option value="local-food-products">
                                Local Food &amp; Products
                            </option>
                            <option value="handicrafts-artisans">
                                Handicrafts &amp; Artisans
                            </option>
                            <option value="tourism-experiences">
                                Tourism Experiences
                            </option>
                            <option value="events-activities">
                                Events &amp; Activities
                            </option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="businessSize">
                            Business Size <span class="required">*</span>
                        </label>
                        <select
                            id="businessSize"
                            name="business_size"
                            required
                        >
                            <option value="" selected disabled>
                                Select business size
                            </option>
                            <option value="small">Small</option>
                            <option value="medium">Medium</option>
                            <option value="large">Large</option>
                        </select>
                    </div>

                    <div class="field full-width">
                        <label for="businessLocation">
                            Business Location <span class="required">*</span>
                        </label>
                        <input
                            type="text"
                            id="businessLocation"
                            name="business_location"
                            placeholder="Enter the city or address in Al-Ahsa"
                            required
                        >
                    </div>

                    <div class="field full-width">
                        <label for="description">
                            Business Description
                        </label>
                        <textarea
                            id="description"
                            name="description"
                            placeholder="Briefly describe your products or services"
                        ></textarea>
                        <span class="hint">
                            A short description helps visitors understand your business.
                        </span>
                    </div>

                    <div class="field">
                        <label for="password">
                            Password <span class="required">*</span>
                        </label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                        <span class="hint">
                            Use at least 8 characters.
                        </span>
                    </div>

                    <div class="field">
                        <label for="confirmPassword">
                            Confirm Password <span class="required">*</span>
                        </label>
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirm_password"
                            placeholder="Re-enter your password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                </div>

                <div class="form-actions">
                    <button class="submit-button" type="submit">
                        Create Business Account
                    </button>
                </div>

            </form>
        </section>

    </div>
</main>

<!-- AI Assistant Button: exact code provided by you -->
<button
    class="chat-button"
    onclick="openAI()"
    aria-label="Open AI Assistant"
    title="AI Assistant">
</button>

<script src="script.js"></script>

<script>
    // Front-end validation only. PHP/backend is needed to save accounts.
    document
        .getElementById("businessRegistrationForm")
        .addEventListener("submit", function (event) {

            event.preventDefault();

            const password = document.getElementById("password");
            const confirmPassword =
                document.getElementById("confirmPassword");

            if (password.value !== confirmPassword.value) {
                confirmPassword.setCustomValidity(
                    "Passwords do not match."
                );
                confirmPassword.reportValidity();
                return;
            }

            confirmPassword.setCustomValidity("");

            alert(
                "The page design is ready. Connect it to the PHP/backend to register accounts."
            );
        });

    document
        .getElementById("confirmPassword")
        .addEventListener("input", function () {
            this.setCustomValidity("");
        });
</script>

</body>
</html>
